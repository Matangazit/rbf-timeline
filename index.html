<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future of Israel 2033 — RBF Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Merriweather:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #00B1BD;
    --teal-dim: rgba(0,177,189,0.15);
    --teal-mid: rgba(0,177,189,0.4);
    --yellow: #FFC500;
    --yellow-dim: rgba(255,197,0,0.12);
    --orange: #E58425;
    --green: #3A7A32;
    --blue: #3F7BBB;
    --purple: #AB86CE;
    --dark: #181818;
    --dark2: #1E1E1E;
    --dark3: #242424;
    --gray: #C2C2C2;
    --light: #F0F0F0;
    --white: #FFFFFF;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { color-scheme: dark; }
  body {
    padding-bottom: 96px !important;
    background: var(--dark);
    color: var(--white);
    font-family: 'Lexend', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  .scenario-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--dark);
    border-bottom: 0.5px solid var(--border2);
    padding: 0 40px;
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  .scenario-tab {
    padding: 16px 24px;
    font-family: 'Lexend', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gray);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .scenario-tab:hover { color: var(--white); }
  .scenario-tab.s1.active { color: #3F7BBB; border-bottom-color: #3F7BBB; }
  .scenario-tab.s2.active { color: #3A7A32; border-bottom-color: #3A7A32; }
  .scenario-tab.s3.active { color: #AB86CE; border-bottom-color: #AB86CE; }
  .scenario-tab.s4.active { color: #E58425; border-bottom-color: #E58425; }

  .page-header {
    padding: 48px 40px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .polly-logo {
    font-family: 'Lexend', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .polly-hex { width: 20px; height: 20px; }

  .page-title { text-align: right; }
  .page-title h1 {
    font-size: 13px;
    font-weight: 300;
    color: var(--gray);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .page-title h2 {
    font-size: 11px;
    font-weight: 300;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.04em;
  }

  .scenario-panel { display: none; padding: 40px; }
  .scenario-panel.active { display: block; }

  .scenario-name {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.2;
    max-width: 600px;
  }

  .scenario-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .meta-pill {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .timeline-section { margin-bottom: 56px; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border2);
  }

  .timeline-track {
    position: relative;
    padding: 0 0 48px;
    overflow-x: auto;
  }

  .year-axis {
    display: flex;
    gap: 0;
    margin-bottom: 0;
    position: relative;
  }

  .year-col {
    flex: 1;
    min-width: 120px;
    position: relative;
  }

  .year-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray);
    letter-spacing: 0.08em;
    padding-bottom: 12px;
    border-bottom: 0.5px solid var(--border2);
    text-align: center;
  }

  .events-row {
    display: flex;
    gap: 0;
    margin-top: 24px;
    align-items: flex-start;
  }

  .event-col {
    flex: 1;
    min-width: 120px;
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .event-card {
    padding: 12px 14px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--dark2);
    font-size: 12px;
    line-height: 1.5;
    color: var(--light);
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
    animation: cardIn 0.4s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .event-card:hover {
    background: var(--dark3);
    transform: translateY(-2px);
  }

  .event-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 8px 8px 0 0;
  }

  .event-card::before { background: var(--theme, var(--teal)); }

  .event-tag {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.6;
  }

  .event-card .event-tag { color: var(--theme, var(--teal)); opacity: 0.9; }

  .event-text { font-size: 12px; line-height: 1.5; }
  .event-role {
    margin-top: 8px;
    font-size: 10px;
    color: var(--gray);
    opacity: 0.6;
  }

  .empty-col {
    height: 80px;
    border: 0.5px dashed var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-col span {
    font-size: 10px;
    color: rgba(255,255,255,0.15);
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--gray);
  }

  .legend-dot {
    width: 10px;
    height: 2px;
    border-radius: 1px;
  }

  .add-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 0.5px dashed var(--border2);
    background: none;
    color: var(--gray);
    font-size: 12px;
    font-family: 'Lexend', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .add-btn:hover { border-color: var(--teal); color: var(--teal); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--dark2);
    border: 0.5px solid var(--border2);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    transform: translateY(12px);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--white);
  }

  .modal label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gray);
    display: block;
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .modal label:first-of-type { margin-top: 0; }

  .modal input, .modal textarea, .modal select {
    width: 100%;
    background: var(--dark);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Lexend', sans-serif;
    font-size: 13px;
    font-weight: 300;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .modal input:focus, .modal textarea:focus, .modal select:focus {
    border-color: var(--teal);
  }

  .modal textarea { resize: vertical; min-height: 80px; }
  .modal select option { background: var(--dark2); }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  .btn-cancel {
    padding: 8px 16px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: none;
    color: var(--gray);
    font-size: 13px;
    font-family: 'Lexend', sans-serif;
    cursor: pointer;
  }

  .btn-save {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    background: var(--teal);
    color: var(--dark);
    font-size: 13px;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    cursor: pointer;
  }

  .btn-delete {
    padding: 8px 16px;
    border-radius: 8px;
    border: 0.5px solid rgba(192,74,58,0.4);
    background: none;
    color: #C04A3A;
    font-size: 13px;
    font-family: 'Lexend', sans-serif;
    cursor: pointer;
    margin-right: auto;
  }

  .timeline-track::-webkit-scrollbar { height: 4px; }
  .timeline-track::-webkit-scrollbar-track { background: transparent; }
  .timeline-track::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .export-bar {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    gap: 8px;
  }

  .export-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 0.5px solid var(--border2);
    background: var(--dark2);
    color: var(--gray);
    font-size: 12px;
    font-family: 'Lexend', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }

  .export-btn:hover { border-color: var(--teal); color: var(--teal); }
  .export-btn.primary { background: var(--teal); color: var(--dark); border-color: var(--teal); font-weight: 600; }
  .export-btn.primary:hover { background: #00CDD9; }

  @media print {
    .scenario-nav, .export-bar, .add-btn, .modal-overlay { display: none !important; }
    .scenario-panel { display: block !important; }
  }

  /* Theme filter chips (replace the old type legend) */
  .theme-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 0.5px solid var(--border2);
    background: none;
    color: var(--light);
    font-family: 'Lexend', sans-serif;
    font-size: 11px;
    font-weight: 400;
    cursor: pointer;
    transition: opacity 0.2s, border-color 0.2s;
  }
  .theme-chip .legend-dot { width: 14px; height: 3px; }
  .theme-chip .chip-count { color: var(--gray); opacity: 0.7; }
  .theme-chip[aria-pressed="false"] { opacity: 0.35; }
  .theme-chip:hover { border-color: var(--gray); }
  .legend-hint { font-size: 10px; color: rgba(255,255,255,0.3); align-self: center; }
  .legend + .legend { margin-top: -12px; }
  .legend-label { font-size: 11px; color: var(--gray); align-self: center; min-width: 52px; }
  .source-checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .modal .source-checks label { display: inline-flex; align-items: center; gap: 6px; margin: 0; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 300; color: var(--light); cursor: pointer; }
  .modal .source-checks input { width: auto; accent-color: var(--teal); }
  .card-sources { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .event-source {
    font-size: 9px;
    font-weight: 400;
    color: var(--gray);
    border: 0.5px solid var(--border2);
    border-radius: 999px;
    padding: 1px 7px;
    white-space: nowrap;
  }
  .event-source.src-transcript { border-style: dashed; }
  .source-chip .src-swatch { width: 14px; height: 9px; border-radius: 999px; border: 0.5px solid var(--gray); }
  .source-chip .src-swatch.src-transcript { border-style: dashed; }

  .year-col.undated .year-label { border-bottom-style: dashed; }
  .year-col.undated .year-label { color: rgba(255,255,255,0.4); font-weight: 400; }

  :root { padding-top: env(safe-area-inset-top, 0px); }
  .export-bar { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px); opacity: 0; pointer-events: none;
    background: #242424; color: var(--light); border: 0.5px solid var(--border2);
    border-radius: 10px; padding: 10px 16px; font-size: 12px; font-family: 'Lexend', sans-serif;
    max-width: min(90vw, 420px); text-align: center; z-index: 300; white-space: pre-line;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (max-width: 720px) {
    .scenario-nav { padding: 0 12px; overflow-x: auto; }
    .scenario-tab { padding: 14px 14px; }
    .page-header { padding: 32px 16px 0; }
    .scenario-panel { padding: 28px 16px; }
    .scenario-name { font-size: 24px; }
    .export-bar { left: 12px; right: 12px; bottom: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .export-btn { padding: 8px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .event-card { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<nav class="scenario-nav" role="tablist">
  <button class="scenario-tab s1 active" onclick="showScenario(0)">01 Fulfilling Next Year in Jerusalem</button>
  <button class="scenario-tab s2" onclick="showScenario(1)">02 We Are Sparta</button>
  <button class="scenario-tab s3" onclick="showScenario(2)">03 Regional Power, Fractured Society</button>
  <button class="scenario-tab s4" onclick="showScenario(3)">04 Reliving Never Again, Again</button>
</nav>

<div class="page-header">
  <div class="polly-logo">
    <svg class="polly-hex" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L21.5 7.5V16.5L12 22L2.5 16.5V7.5L12 2Z" stroke="#00B1BD" stroke-width="1.5" fill="none"/>

  </div>
  <div class="page-title">

  </div>
</div>

<div id="panel-0" class="scenario-panel active"></div>
<div id="panel-1" class="scenario-panel"></div>
<div id="panel-2" class="scenario-panel"></div>
<div id="panel-3" class="scenario-panel"></div>

<div class="modal-overlay" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <label for="m-theme">Theme</label>
    <select id="m-theme"></select>
    <label>Source</label>
    <div id="m-sources" class="source-checks"></div>
    <label for="m-year">Year</label>

    <div class="modal-actions">
      <button class="btn-delete" id="btn-delete" onclick="deleteEntry()" style="display:none">Delete</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="export-bar">
  <button class="export-btn" onclick="window.print()">Print / Export PDF</button>
  <button class="export-btn" id="reset-btn" onclick="resetData()">Reset</button>
  <button class="export-btn" onclick="document.getElementById('load-input').click()">Load Data</button>
  <input type="file" id="load-input" accept=".json" style="display:none" onchange="loadJSON(event)" />
  <button class="export-btn primary" onclick="exportJSON()">Save Data</button>
</div>

function srcList(e) {
  if (Array.isArray(e.sources) && e.sources.length) return e.sources;
  return [e.source || 'Added'];
}
let currentScenario = 0;
let editingEntry = null;
let activeThemes = new Set(THEMES.map(t => t.name));
const SOURCES = ['Form', 'Transcript', 'Added'];
let activeSources = new Set(SOURCES);

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ seed: SEED_VERSION, data })); } catch(e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function themeColor(name) {
  const t = THEMES.find(t => t.name === name);
  return t ? t.color : '#C2C2C2';
}
function themeOrder(name) {
  const i = THEMES.findIndex(t => t.name === name);
  return i === -1 ? 99 : i;
}

function showScenario(idx) {
  currentScenario = idx;
  document.querySelectorAll('.scenario-tab').forEach((t,i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.scenario-panel').forEach((p,i) => p.classList.toggle('active', i === idx));
  renderPanel(idx);
}

function toggleSource(name) {
  if (activeSources.has(name)) activeSources.delete(name); else activeSources.add(name);
  SCENARIOS.forEach((_, i) => renderPanel(i));
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

let resetArmed = false, resetTimer = null;
function resetData() {
  const btn = document.getElementById('reset-btn');
  if (!resetArmed) {
    resetArmed = true; btn.textContent = 'Click again to reset';
    toast('This restores every original event and undoes your edits and removals.');
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = 'Reset'; }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false; btn.textContent = 'Reset';
  toast('All original events restored.');
  data = JSON.parse(JSON.stringify(SEED));
  save();
  SCENARIOS.forEach((_, i) => renderPanel(i));
  showScenario(currentScenario);

function toggleTheme(name) {
  if (activeThemes.has(name)) activeThemes.delete(name); else activeThemes.add(name);
  SCENARIOS.forEach((_, i) => renderPanel(i));
}

function renderPanel(idx) {

  const sc = SCENARIOS[idx];
  const entries = data[idx];
  const cols = [...YEARS, UNDATED];

  const byYear = {};
  cols.forEach(y => byYear[y] = []);
  entries.forEach((e, i) => {
    if (!activeThemes.has(e.theme) || !srcList(e).some(src => activeSources.has(src))) return;
    const y = YEARS.includes(e.year) ? e.year : UNDATED;
    byYear[y].push({ ...e, idx: i });
  });
  cols.forEach(y => byYear[y].sort((a, b) => themeOrder(a.theme) - themeOrder(b.theme) || a.idx - b.idx));
  const hasUndated = entries.some(e => !YEARS.includes(e.year));

  const counts = {};
  THEMES.forEach(t => counts[t.name] = entries.filter(e => e.theme === t.name).length);
  const srcCounts = {};
  SOURCES.forEach(src => srcCounts[src] = entries.filter(e => srcList(e).includes(src)).length);

  panel.innerHTML = `
    <div class="scenario-header" style="position:relative;margin-bottom:40px;padding-bottom:32px;border-bottom:0.5px solid var(--border2);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;">
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:${sc.color};margin-bottom:8px">${sc.num}</div>
        <div class="scenario-name">${sc.name}</div>
      </div>
      <div class="scenario-meta">
        <span class="meta-pill" style="background:rgba(0,177,189,0.1);color:#00B1BD">${entries.length} Events</span>

    </div>

    <div class="legend">
      ${THEMES.map(t => `
        <button class="theme-chip" aria-pressed="${activeThemes.has(t.name)}" onclick="toggleTheme('${t.name}')">
          <span class="legend-dot" style="background:${t.color}"></span>${t.name}<span class="chip-count">${counts[t.name]}</span>
        </button>`).join('')}
      <span class="legend-hint">Click a theme or source to show or hide it. Cards found in both sources carry both labels.</span>
    </div>
    <div class="legend">
      <span class="legend-label">Source</span>
      ${SOURCES.filter(src => src !== 'Added' || srcCounts[src] > 0).map(src => `
        <button class="theme-chip source-chip" aria-pressed="${activeSources.has(src)}" onclick="toggleSource('${src}')">
          <span class="src-swatch src-${src.toLowerCase()}"></span>${src}<span class="chip-count">${srcCounts[src]}</span>
        </button>`).join('')}
    </div>

    <div class="timeline-section">
      <div class="section-label">Timeline 2026 → 2033</div>
      <div class="timeline-track">
        <div class="year-axis">
          ${cols.map(y => (y === UNDATED && !hasUndated) ? '' :
            `<div class="year-col ${y === UNDATED ? 'undated' : ''}"><div class="year-label">${y === UNDATED ? 'No year given' : y}</div></div>`).join('')}
        </div>
        <div class="events-row">
          ${cols.map(y => {
            if (y === UNDATED && !hasUndated) return '';
            const items = byYear[y];
            const cls = y === UNDATED ? 'event-col undated' : 'event-col';
            if (items.length === 0) {
              return `<div class="${cls}"><div class="empty-col"><span>—</span></div></div>`;
            }
            return `<div class="${cls}">
              ${items.map((e, n) => `
                <div class="event-card" role="button" tabindex="0" style="--theme:${themeColor(e.theme)};animation-delay:${n * 0.05}s"
                     onclick="editEntry(${idx}, ${e.idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editEntry(${idx}, ${e.idx})}">
                  <div class="event-tag">${esc(e.theme || 'No theme')}</div>
                  <div class="event-text">${esc(e.text)}</div>
                  <div class="card-sources">${srcList(e).map(src => `<span class="event-source src-${src.toLowerCase()}">${esc(src)}</span>`).join('')}</div>
                </div>
              `).join('')}
            </div>`;
          }).join('')}
        </div>
      </div>
      <button class="add-btn" onclick="openModal(${idx})">+ Add event</button>

function fillSelects() {
  document.getElementById('m-theme').innerHTML = THEMES.map(t => `<option>${t.name}</option>`).join('');
  document.getElementById('m-sources').innerHTML = SOURCES.map(src =>
    `<label><input type="checkbox" value="${src}">${src}</label>`).join('');
  document.getElementById('m-year').innerHTML =
    YEARS.map(y => `<option value="${y}">${y}</option>`).join('') + `<option value="">No year given</option>`;
}

function openModal(scenarioIdx, entryIdx = null) {
  currentScenario = scenarioIdx;
  editingEntry = entryIdx !== null ? entryIdx : null;

  if (entryIdx !== null) {
    const e = data[scenarioIdx][entryIdx];
    document.getElementById('modal-title').textContent = 'Edit event';
    document.getElementById('m-theme').value = e.theme;
    setChecked(srcList(e));
    document.getElementById('m-year').value = YEARS.includes(e.year) ? e.year : '';
    document.getElementById('m-text').value = e.text;
    document.getElementById('btn-delete').style.display = 'block';
  } else {
    document.getElementById('modal-title').textContent = 'Add event';
    document.getElementById('m-theme').value = THEMES[0].name;
    setChecked(['Added']);
    document.getElementById('m-year').value = '2026';
    document.getElementById('m-text').value = '';
    document.getElementById('btn-delete').style.display = 'none';
  }

  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('m-text').focus(), 200);
}

function setChecked(list) {
  document.querySelectorAll('#m-sources input').forEach(i => i.checked = list.includes(i.value));
}

function editEntry(scenarioIdx, entryIdx) { openModal(scenarioIdx, entryIdx); }

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingEntry = null;
}

function saveEntry() {
  const theme = document.getElementById('m-theme').value;
  const year = document.getElementById('m-year').value;
  let sources = [...document.querySelectorAll('#m-sources input:checked')].map(i => i.value);
  if (!sources.length) sources = ['Added'];
  const text = document.getElementById('m-text').value.trim();
  if (!text) { document.getElementById('m-text').focus(); return; }

  if (editingEntry !== null) data[currentScenario][editingEntry] = { theme, year, text, sources };
  else data[currentScenario].push({ theme, year, text, sources });

  save(); closeModal(); renderPanel(currentScenario);
}

function deleteEntry() {
  if (editingEntry === null) return;
  data[currentScenario].splice(editingEntry, 1);
  save(); closeModal(); renderPanel(currentScenario);
}

async function exportJSON() {
  const json = JSON.stringify(data, null, 2);
  const filename = 'rbf_timeline_data.json';
  if (window.claude && typeof window.claude.use === 'function') {
    let downloads = null;
    try { downloads = await window.claude.use('downloads'); } catch(e) {}
    if (downloads) {
      try { await downloads.save({ filename, data: json }); toast('Saved. Send the .json file back to the PollyLabs team.'); }
      catch(e) { if (e && e.code !== 'declined') toast('Couldn’t save the file here. Try again in a moment.'); }
      return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = filename;
  a.click();
}

function loadJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const loaded = JSON.parse(e.target.result);
      if (Array.isArray(loaded) && loaded.length === 4 && loaded.every(Array.isArray)) {
        data = loaded;
        save();
        SCENARIOS.forEach((_, i) => renderPanel(i));
        showScenario(currentScenario);
        toast('Data loaded.');
      } else {
        toast('This file isn’t timeline data. Choose a .json file saved with Save Data.');
      }
    } catch(err) {
      toast('Couldn’t read this file. Choose a .json file saved with Save Data.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ---------- CSV import (Formless export) ---------- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function parseEvent(raw) {
  const m = raw.match(/^\s*(20\d{2})\s*[:\-–—.]?\s*/);
  if (m && YEARS.includes(m[1])) {
    const t = raw.slice(m[0].length).trim();
    return { year: m[1], text: t.charAt(0).toUpperCase() + t.slice(1) };
  }
  return { year: '', text: raw.trim() };
}

function normKey(s) { return String(s).toLowerCase().replace(/\s+/g, ' ').trim(); }

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const rows = parseCSV(e.target.result).filter(r => r.some(c => c.trim() !== ''));
    if (rows.length < 2) { toast('This CSV has no responses.'); return; }
    const head = rows[0].map(h => h.trim());
    const col = name => head.indexOf(name);
    if (col('theme') === -1) { toast('This CSV has no "theme" column. Export the Formless form for this workshop and try again.'); return; }

    let added = 0, dupes = 0, partial = 0, unknownTheme = 0;
    rows.slice(1).forEach(r => {
      const get = name => (col(name) === -1 ? '' : (r[col(name)] || '').trim());
      const cells = [];
      SCENARIOS.forEach((sc, si) => [1,2,3].forEach(n => {
        const v = get(`${sc.key}_event_${n}`); if (v) cells.push([si, v]);
      }));
      if (!cells.length) return;
      if (col('status') !== -1 && get('status').toUpperCase() !== 'COMPLETED') { partial++; return; }
      const theme = THEME_ALIASES[normKey(get('theme'))];
      if (!theme) { unknownTheme++; return; }
      cells.forEach(([si, raw]) => {
        const p = parseEvent(raw);
        if (data[si].some(x => normKey(x.text) === normKey(p.text))) { dupes++; return; }
        data[si].push({ theme, year: p.year, text: p.text });
        added++;
      });
    });

    save();
    SCENARIOS.forEach((_, i) => renderPanel(i));
    showScenario(currentScenario);
    const notes = [];
    if (dupes) notes.push(`${dupes} already on the timeline`);
    if (partial) notes.push(`${partial} unfinished response${partial > 1 ? 's' : ''} skipped`);
    if (unknownTheme) notes.push(`${unknownTheme} response${unknownTheme > 1 ? 's' : ''} with an unknown theme skipped`);
    toast(`Added ${added} event${added === 1 ? '' : 's'}.` + (notes.length ? '\n' + notes.join('\n') : ''));
  };
  reader.readAsText(file);
  event.target.value = '';
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

fillSelects();
SCENARIOS.forEach((_, i) => renderPanel(i));
showScenario(0);
</script>
